name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate instructions
        run: python scripts/validate-instructions.py
      - name: Validate skills
        run: python scripts/validate-skills.py
      - name: Check generated files are current
        run: python scripts/build-collections.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
